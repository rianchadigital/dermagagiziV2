    <script>
      // Fallback deteksi Hostinger jika web server memuat root index.html alih-alih bundle dist
      if (!window.__vite_plugin_react_preamble_installed__ && window.location.port !== '3000' && !window.location.hostname.includes('run.app')) {
        setTimeout(function() {
          var rootEl = document.getElementById('root');
          if (rootEl && !rootEl.hasChildNodes()) {
            if (window.location.pathname.indexOf('/dist') === -1) {
              window.location.replace('./dist/');
            }
          }
        }, 500);
      }
